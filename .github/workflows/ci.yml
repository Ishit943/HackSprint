name: Monster Match CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Validate HTML files in pages/
  # ─────────────────────────────────────────────
  validate-html:
    name: Validate HTML Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check HTML files exist and are non-empty
        run: |
          python3 - <<'EOF'
          import os
          import sys

          pages_dir = 'pages'
          errors = []

          if not os.path.isdir(pages_dir):
            print(f"ERROR: '{pages_dir}/' directory not found!")
            sys.exit(1)

          html_files = [f for f in os.listdir(pages_dir) if f.endswith('.html')]

          if not html_files:
            print(f"WARNING: No .html files found in '{pages_dir}/'")
            sys.exit(1)

          print(f"Found {len(html_files)} HTML file(s) in '{pages_dir}/':")

          for filename in sorted(html_files):
            filepath = os.path.join(pages_dir, filename)
            size = os.path.getsize(filepath)
            if size == 0:
              errors.append(f"  ❌ {filepath} — file is EMPTY (0 bytes)")
            else:
              with open(filepath, 'r', encoding='utf-8', errors='replace') as f:
                content = f.read()
              if '<!DOCTYPE html>' not in content and '<!doctype html>' not in content.lower():
                errors.append(f"  ⚠️  {filepath} — missing <!DOCTYPE html> declaration")
              else:
                print(f"  ✅ {filepath} ({size} bytes)")

          if errors:
            print("\nValidation Errors:")
            for err in errors:
              print(err)
            sys.exit(1)
          else:
            print(f"\n✅ All {len(html_files)} HTML file(s) passed validation.")
          EOF

  # ─────────────────────────────────────────────
  # Job 2: Lint — ensure no secrets are committed
  # ─────────────────────────────────────────────
  lint-check:
    name: Secrets Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for accidentally committed secrets
        run: |
          python3 - <<'EOF'
          import subprocess
          import sys

          print("🔍 Scanning tracked files for committed secrets...")

          # 1. Ensure no secret .env files are tracked (only .env.example allowed)
          tracked_files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          env_violations = [f for f in tracked_files if f == '.env' or (f.startswith('.env.') and f != '.env.example')]

          if env_violations:
            print(f"\n❌ SECURITY VIOLATION: Secret .env file(s) are tracked by git:")
            for ev in env_violations:
              print(f"  - {ev}")
            print("   Remove these from git tracking immediately.")
            sys.exit(1)
          else:
            print("✅ No secret .env files are tracked by git (only .env.example template present).")

          # 2. Check that no service role key is hardcoded in source code files (js, html, css, functions)
          code_files = [f for f in tracked_files if f.endswith(('.js', '.html', '.css'))]
          key_violations = []

          for filepath in code_files:
            try:
              with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
                if 'SUPABASE_SERVICE_ROLE_KEY' in content:
                  key_violations.append(filepath)
            except Exception:
              pass

          if key_violations:
            print(f"\n❌ SECURITY VIOLATION: SUPABASE_SERVICE_ROLE_KEY found in code files:")
            for kv in key_violations:
              print(f"  - {kv}")
            print("   Never commit the service role key. Use environment secrets instead.")
            sys.exit(1)
          else:
            print("✅ No service role keys found in source code files.")

          print("\n✅ All secrets checks passed successfully.")
          EOF

  # ─────────────────────────────────────────────
  # Job 3: Verify critical file structure
  # ─────────────────────────────────────────────
  file-structure:
    name: Verify File Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check critical files and directories exist
        run: |
          python3 - <<'EOF'
          import os
          import sys

          # Files that MUST exist for Monster Match to function
          REQUIRED_FILES = [
            'index.html',
            'js/auth.js',
            'js/api.js',
            'js/utils.js',
            'js/config.js',
            'css/variables.css',
            'css/base.css',
            'css/components.css',
            'sql/schema.sql'
          ]

          # Directories that MUST exist
          REQUIRED_DIRS = [
            'css',
            'js',
            'pages',
            'sql',
            'docs'
          ]

          errors = []

          print("📁 Checking required directories...")
          for d in REQUIRED_DIRS:
            if os.path.isdir(d):
              print(f"  ✅ {d}/")
            else:
              errors.append(f"  ❌ Missing required directory: {d}/")

          print("\n📄 Checking required files...")
          for filepath in REQUIRED_FILES:
            if os.path.isfile(filepath):
              size = os.path.getsize(filepath)
              if size == 0:
                errors.append(f"  ❌ {filepath} exists but is EMPTY")
              else:
                print(f"  ✅ {filepath} ({size} bytes)")
            else:
              errors.append(f"  ❌ Missing required file: {filepath}")

          if errors:
            print("\n❌ File Structure Errors:")
            for err in errors:
              print(err)
            print(f"\n{len(errors)} error(s) found. Please fix the file structure before merging.")
            sys.exit(1)
          else:
            print(f"\n✅ All critical files and directories are present.")
          EOF
