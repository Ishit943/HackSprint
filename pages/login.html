<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Monster Match</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="nav-brand">
        <div class="brand-icon">🎃</div>
        <span>Monster<span style="color: var(--color-primary);">Match</span></span>
      </a>
      <div class="nav-actions">
        <button class="btn-icon-toggle theme-toggle-btn" id="theme-toggle" title="Toggle Theme">🌙</button>
      </div>
    </div>
  </header>

  <main class="container container-narrow" style="padding-top: var(--spacing-12); padding-bottom: var(--spacing-16); max-width: 480px;">
    <div style="text-align: center; margin-bottom: var(--spacing-6);">
      <div class="float-anim" style="font-size: 3rem; margin-bottom: var(--spacing-2);">👾</div>
      <h2>Welcome Back</h2>
      <p>Log in to discover teammates and manage your hackathon projects.</p>
    </div>

    <form id="login-form" class="card">
      <div class="form-group">
        <label class="form-label" for="login-email">College or Personal Email</label>
        <input type="email" id="login-email" class="input" placeholder="e.g. aarav.sharma@juet.ac.in" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input type="password" id="login-password" class="input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-4);">
        Log In 🚀
      </button>

      <!-- 1-Click Demo Profiles -->
      <div style="margin-top: var(--spacing-6); border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: var(--spacing-4);">
        <span style="font-size: var(--font-size-xs); font-weight: 700; color: var(--color-primary); display:block; margin-bottom: var(--spacing-3); text-align:center; letter-spacing: 0.05em;">
          ⚡ 1-CLICK DEMO PERSONAS (SWITCH USERS):
        </span>
        <div style="display: flex; flex-direction: column; gap: var(--spacing-2);">
          <div class="grid grid-cols-2 gap-2">
            <button type="button" class="btn btn-outline btn-sm demo-btn" data-email="aarav.sharma@juet.ac.in" style="justify-content: flex-start; font-size: 11px;">
              👨‍💻 Aarav (Fullstack)
            </button>
            <button type="button" class="btn btn-outline btn-sm demo-btn" data-email="ananya.v@juet.ac.in" style="justify-content: flex-start; font-size: 11px;">
              🤖 Ananya (AI/ML)
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" class="btn btn-outline btn-sm demo-btn" data-email="rohan.m@juet.ac.in" style="justify-content: flex-start; font-size: 11px;">
              🎨 Rohan (UI/UX)
            </button>
            <button type="button" class="btn btn-outline btn-sm demo-btn" data-email="sneha.patel@juet.ac.in" style="justify-content: flex-start; font-size: 11px;">
              📱 Sneha (Mobile/IoT)
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" class="btn btn-outline btn-sm demo-btn" data-email="kabir.j@juet.ac.in" style="justify-content: flex-start; font-size: 11px;">
              ⛓️ Kabir (Web3/Sec)
            </button>
            <button type="button" class="btn btn-outline btn-sm demo-btn" data-email="tanvi.s@juet.ac.in" style="justify-content: flex-start; font-size: 11px;">
              ☁️ Tanvi (DevOps/Cloud)
            </button>
          </div>
        </div>
      </div>

      <p style="text-align: center; font-size: var(--font-size-sm); margin-top: var(--spacing-6); margin-bottom: 0;">
        Don't have an account? <a href="signup.html" style="font-weight: 700;">Sign up free</a>
      </p>
    </form>
  </main>

  <script type="module">
    import { initTheme, showToast } from '../js/utils.js';
    import { Auth } from '../js/auth.js';

    initTheme();

    const form = document.getElementById('login-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;

      try {
        await Auth.signIn(email, pass);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.querySelectorAll('.demo-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        document.getElementById('login-email').value = btn.dataset.email;
        document.getElementById('login-password').value = 'password123';
        await Auth.signIn(btn.dataset.email, 'password123');
        window.location.href = 'dashboard.html';
      });
    });
  </script>
</body>
</html>
