<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects & Teammate Requirements - Monster Match</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="nav-brand">
        <div class="brand-icon">🎃</div>
        <span>Monster<span style="color: var(--color-primary);">Match</span></span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="explore.html" class="nav-link">🔍 Explore Students</a></li>
          <li><a href="projects.html" class="nav-link active">📋 Projects</a></li>
          <li><a href="connections.html" class="nav-link">💬 Connections</a></li>
          <li><a href="dashboard.html" class="nav-link">⚡ Dashboard</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <button class="btn-icon-toggle theme-toggle-btn" id="theme-toggle" title="Toggle Theme">🌙</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: var(--spacing-8); padding-bottom: var(--spacing-16);">
    <!-- Header with CTA to Post Project -->
    <div class="flex items-center justify-between flex-wrap gap-4" style="margin-bottom: var(--spacing-8);">
      <div>
        <span class="badge" style="background:var(--color-primary-light); color:var(--color-primary); margin-bottom:var(--spacing-2);">
          Phase 3: Team Requirements
        </span>
        <h2>Hackathon Projects & Team Openings</h2>
        <p style="margin-bottom: 0;">Find projects seeking your exact skills or post your own hackathon squad requirements.</p>
      </div>
      <a href="project-new.html" class="btn btn-primary">
        <span>✨ Post New Project</span>
      </a>
    </div>

    <!-- Filter & Search Controls -->
    <div class="flex items-center justify-between flex-wrap gap-4" style="margin-bottom: var(--spacing-6);">
      <div class="search-wrapper" style="max-width: 440px;">
        <span class="search-icon">🔍</span>
        <input type="text" id="project-search" class="input search-input" placeholder="Search by project name, hackathon, tech...">
      </div>

      <div class="flex items-center gap-3">
        <select id="project-category" class="select" style="width: auto;">
          <option value="">All Categories</option>
          <option value="HealthTech & Bio">HealthTech & Bio</option>
          <option value="Fintech & Payments">Fintech & Payments</option>
          <option value="AI & Generative Agents">AI & Generative Agents</option>
          <option value="Web3 & DeFi">Web3 & DeFi</option>
          <option value="Hackathon">General Hackathon</option>
        </select>
      </div>
    </div>

    <!-- Projects Grid -->
    <div id="projects-grid" class="grid grid-cols-2 gap-6">
      <!-- Populated dynamically via JS -->
    </div>
  </main>

  <script type="module">
    import { initTheme, debounce, showToast, formatDate } from '../js/utils.js';
    import { Auth } from '../js/auth.js';
    import { API, getCurrentUser } from '../js/api.js';

    initTheme();
    Auth.renderNavAuth();

    const searchInput = document.getElementById('project-search');
    const categorySelect = document.getElementById('project-category');

    async function loadProjects() {
      const grid = document.getElementById('projects-grid');
      const q = searchInput.value;
      const cat = categorySelect.value;

      try {
        const projects = await API.getProjects({ query: q, category: cat });
        const currentUser = getCurrentUser();

        if (projects.length === 0) {
          grid.innerHTML = `
            <div class="card" style="grid-column: 1 / -1; text-align: center; padding: var(--spacing-12);">
              <div style="font-size: 3rem; margin-bottom: var(--spacing-3);">🚀</div>
              <h3>No projects found</h3>
              <p>Be the first one to post a project and recruit monster teammates!</p>
              <a href="project-new.html" class="btn btn-primary btn-sm">Post a Project Now</a>
            </div>
          `;
          return;
        }

        grid.innerHTML = projects.map(p => `
          <div class="card card-hover flex flex-col justify-between">
            <div>
              <!-- Header -->
              <div class="flex items-center justify-between" style="margin-bottom: var(--spacing-3);">
                <span class="badge" style="background:var(--color-primary-light); color:var(--color-primary);">
                  ${p.category || 'Hackathon'}
                </span>
                <span style="font-size: var(--font-size-xs); color: var(--text-muted); font-weight:600;">
                  📅 Deadline: ${formatDate(p.deadline) || 'Upcoming'}
                </span>
              </div>

              <!-- Title & Hackathon Name -->
              <h3 style="margin-bottom: var(--spacing-1); font-size: var(--font-size-xl);">${p.title}</h3>
              <div style="font-size: var(--font-size-xs); font-weight: 700; color: var(--color-accent); margin-bottom: var(--spacing-4);">
                🏆 ${p.hackathon_name || 'Hackathon Project'}
              </div>

              <!-- Description -->
              <p style="font-size: var(--font-size-sm); margin-bottom: var(--spacing-4); line-height: 1.5;">
                ${p.description}
              </p>

              <!-- Roles Needed -->
              <div style="margin-bottom: var(--spacing-4);">
                <span style="font-size: var(--font-size-xs); font-weight: 700; color: var(--text-muted); text-transform: uppercase;">
                  Open Roles Needed:
                </span>
                <div style="margin-top: var(--spacing-2); display:flex; flex-direction:column; gap: var(--spacing-2);">
                  ${p.roles.map(r => `
                    <div style="background: var(--bg-surface-subtle); padding: 8px 12px; border-radius: var(--radius-lg); font-size: var(--font-size-xs); display:flex; justify-content:space-between; align-items:center;">
                      <div>
                        <strong>${r.title}</strong>
                        <div style="display:flex; gap:4px; margin-top:4px; flex-wrap:wrap;">
                          ${r.skills.map(s => `<span class="chip chip-intermediate" style="padding:1px 6px; font-size:10px;">${s}</span>`).join('')}
                        </div>
                      </div>
                      <span class="badge badge-open" style="font-size:10px;">${r.slots} slot${r.slots > 1 ? 's' : ''}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- Footer: Owner & Action -->
            <div class="flex items-center justify-between" style="border-top: 1px solid var(--border-color); padding-top: var(--spacing-4); margin-top: var(--spacing-4);">
              <div class="flex items-center gap-2">
                <img src="${p.owner_avatar}" alt="${p.owner_name}" style="width: 34px; height: 34px; border-radius: 50%; border:1px solid var(--color-primary);" />
                <span style="font-size: var(--font-size-xs); font-weight: 600;">${p.owner_name}</span>
              </div>

              <div class="flex items-center gap-2">
                <a href="explore.html?project=${p.id}" class="btn btn-outline btn-sm">Find Matches</a>
                <a href="profile-view.html?id=${p.owner_id}" class="btn btn-primary btn-sm">Connect 👾</a>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p style="color:var(--color-danger);">Failed to load projects.</p>';
      }
    }

    searchInput.addEventListener('input', debounce(loadProjects, 300));
    categorySelect.addEventListener('change', loadProjects);
    loadProjects();
  </script>
</body>
</html>
