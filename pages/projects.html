<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects & Teammate Requirements - Monster Match</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Cinzel+Decorative:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="nav-brand">
        <div class="brand-icon">🎃</div>
        <span>Monster<span style="color: var(--color-primary);">Match</span></span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="explore.html" class="nav-link">🔍 Explore Students</a></li>
          <li><a href="projects.html" class="nav-link active">📋 Projects</a></li>
          <li><a href="connections.html" class="nav-link">💬 Connections</a></li>
          <li><a href="dashboard.html" class="nav-link">⚡ Dashboard</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <button class="btn-icon-toggle theme-toggle-btn" id="theme-toggle" title="Toggle Theme">🌙</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: var(--spacing-8); padding-bottom: var(--spacing-16);">
    <!-- Header with CTA to Post Project -->
    <div class="flex items-center justify-between flex-wrap gap-4" style="margin-bottom: var(--spacing-8);">
      <div>
        <span class="badge" style="background: rgba(255, 85, 0, 0.15); color: #ff7700; border: 1px solid rgba(255, 85, 0, 0.4); margin-bottom: var(--spacing-2);">
          🎃 Project Grimoires & Requirements
        </span>
        <h2 class="font-creepster" style="color: #ff5500; font-size: 2.3rem; margin-bottom: 4px; text-shadow: 0 0 15px rgba(255, 85, 0, 0.5);">
          Showcase Projects & Discover Teammates
        </h2>
        <p style="margin-bottom: 0; color: var(--text-secondary);">Browse hackathon repositories, inspect tech stacks, and forge covenants with fellow builders.</p>
      </div>
      <a href="project-new.html" class="btn btn-primary">
        <span>✨ Summon New Project</span>
      </a>
    </div>

    <!-- Filter & Search Controls -->
    <div class="flex items-center justify-between flex-wrap gap-4" style="margin-bottom: var(--spacing-6);">
      <div class="search-wrapper" style="max-width: 440px;">
        <span class="search-icon">🔍</span>
        <input type="text" id="project-search" class="input search-input" placeholder="Search by project name, hackathon, tech...">
      </div>

      <div class="flex items-center gap-3">
        <select id="project-category" class="select" style="width: auto;">
          <option value="">All Categories</option>
          <option value="my_projects">👤 My Projects Only</option>
          <option value="HealthTech & Bio">HealthTech & Bio</option>
          <option value="Fintech & Payments">Fintech & Payments</option>
          <option value="AI & Generative Agents">AI & Generative Agents</option>
          <option value="Web3 & DeFi">Web3 & DeFi</option>
          <option value="Hackathon">General Hackathon</option>
        </select>
      </div>
    </div>

    <!-- Projects Grid -->
    <div id="projects-grid" class="grid grid-cols-2 gap-6">
      <!-- Populated dynamically via JS -->
    </div>
  </main>

  <script type="module">
    import { initTheme, debounce, showToast, formatDate } from '../js/utils.js';
    import { Auth } from '../js/auth.js';
    import { API, getCurrentUser } from '../js/api.js';

    initTheme();
    Auth.renderNavAuth();

    const searchInput = document.getElementById('project-search');
    const categorySelect = document.getElementById('project-category');

    async function loadProjects() {
      const grid = document.getElementById('projects-grid');
      const q = searchInput.value;
      const cat = categorySelect.value;

      try {
        const projects = await API.getProjects({ query: q, category: cat });
        const currentUser = getCurrentUser();

        if (projects.length === 0) {
          grid.innerHTML = `
            <div class="grimoire-card" style="grid-column: 1 / -1; text-align: center; padding: var(--spacing-12);">
              <div style="font-size: 3rem; margin-bottom: var(--spacing-3);">🎃</div>
              <h3 class="font-creepster" style="color: #ff5500; font-size: 1.8rem;">No Project Grimoires Found</h3>
              <p>Be the first one to summon a project and recruit monster teammates!</p>
              <a href="project-new.html" class="btn btn-primary btn-sm">Summon a Project Now 🎃</a>
            </div>
          `;
          return;
        }

        grid.innerHTML = projects.map(p => {
          const stack = p.tech_stack || (p.roles ? p.roles.flatMap(r => r.skills) : ['JavaScript', 'Web']);
          const stackParam = encodeURIComponent(stack.slice(0, 3).join(','));
          const isOwner = currentUser && (currentUser.id === p.owner_id);

          return `
            <div class="grimoire-card card-hover flex flex-col justify-between">
              <div>
                <!-- Header -->
                <div class="flex items-center justify-between" style="margin-bottom: var(--spacing-3);">
                  <span class="badge" style="background:rgba(255, 85, 0, 0.15); color:var(--color-primary); border: 1px solid rgba(255, 85, 0, 0.35); font-size: 11px;">
                    ${p.category || 'Web Project'}
                  </span>
                  <div class="flex items-center gap-2">
                    ${p.github_url ? `
                      <a href="${p.github_url}" target="_blank" rel="noopener" style="font-size: 11px; color: var(--text-muted); display:inline-flex; align-items:center; gap:4px; text-decoration:none;">
                        <span>📂 GitHub</span>
                        <span>↗</span>
                      </a>
                    ` : ''}
                    ${isOwner ? `
                      <button class="btn btn-outline btn-sm delete-project-btn" data-id="${p.id}" data-title="${p.title}" style="font-size: 11px; padding: 2px 8px; color: #f87171; border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.06);" title="Delete this project">
                        🗑️ Delete
                      </button>
                    ` : ''}
                  </div>
                </div>

                <!-- Title -->
                <h3 style="margin-bottom: var(--spacing-2); font-size: var(--font-size-lg);">${p.title}</h3>

                <!-- Description -->
                <p style="font-size: var(--font-size-sm); margin-bottom: var(--spacing-4); line-height: 1.5; color: var(--text-secondary);">
                  ${p.description}
                </p>

                <!-- Tech Stack Pills -->
                <div style="margin-bottom: var(--spacing-4);">
                  <div style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 6px;">
                    Tech Stack:
                  </div>
                  <div class="flex flex-wrap gap-2">
                    ${stack.map(s => `
                      <span class="skill-pill tier-intermediate" style="font-size: 11px; padding: 2px 8px;">
                        <span class="dot"></span>${s}
                      </span>
                    `).join('')}
                  </div>
                </div>

                <!-- Looking For Note (if provided) -->
                ${p.looking_for ? `
                  <div style="font-size: 11px; color: #ff8c26; background: rgba(255, 85, 0, 0.1); border: 1px solid rgba(255, 85, 0, 0.25); border-radius: 6px; padding: 6px 10px; margin-bottom: var(--spacing-4);">
                    🤝 <strong>Looking for:</strong> ${p.looking_for}
                  </div>
                ` : ''}

                <!-- Quick External Links (GitHub / Demo) -->
                ${(p.github_url || p.demo_url) ? `
                  <div class="flex items-center gap-2 flex-wrap" style="margin-bottom: var(--spacing-4);">
                    ${p.github_url ? `
                      <a href="${p.github_url}" target="_blank" rel="noopener" class="btn btn-outline btn-sm" style="font-size: 11px; padding: 3px 8px;">
                        📂 View Code ↗
                      </a>
                    ` : ''}
                    ${p.demo_url ? `
                      <a href="${p.demo_url}" target="_blank" rel="noopener" class="btn btn-outline btn-sm" style="font-size: 11px; padding: 3px 8px; border-color: var(--color-slime); color: var(--color-slime);">
                        🌐 Live Demo ↗
                      </a>
                    ` : ''}
                  </div>
                ` : ''}
              </div>

              <!-- Footer: Owner & Actions -->
              <div class="flex items-center justify-between" style="border-top: 1px solid rgba(255, 85, 0, 0.18); padding-top: var(--spacing-4); margin-top: auto;">
                <div class="flex items-center gap-2" style="min-width: 0;">
                  <img src="${p.owner_avatar}" alt="${p.owner_name}" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--color-primary); flex-shrink: 0;" />
                  <div>
                    <span style="font-size: var(--font-size-xs); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">${p.owner_name}</span>
                    ${isOwner ? '<span style="font-size: 10px; color: #ff8c26; font-weight: 700;">★ Your Project</span>' : ''}
                  </div>
                </div>

                <div class="flex items-center gap-2 flex-shrink-0">
                  <a href="explore.html?skills=${stackParam}" class="btn btn-outline btn-sm" style="font-size: 11px; padding: 3px 8px;">
                    ${isOwner ? 'Find Teammates ⚡' : 'Find Matches ⚡'}
                  </a>
                  ${isOwner ? `
                    <button class="btn btn-outline btn-sm delete-project-btn" data-id="${p.id}" data-title="${p.title}" style="font-size: 11px; padding: 3px 8px; color: #f87171; border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.06);" title="Delete this project">
                      🗑️ Delete
                    </button>
                  ` : `
                    <a href="profile-view.html?id=${p.owner_id}" class="btn btn-primary btn-sm" style="font-size: 11px; padding: 3px 10px;">
                      Connect 🎃
                    </a>
                  `}
                </div>
              </div>
            </div>
          `;
        }).join('');

        // Attach Delete Project Handlers
        grid.querySelectorAll('.delete-project-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            const projId = btn.dataset.id;
            const projTitle = btn.dataset.title;

            if (!confirm(`Are you sure you want to delete "${projTitle}"?\nThis action cannot be undone.`)) {
              return;
            }

            try {
              await API.deleteProject(projId);
              showToast(`Project "${projTitle}" deleted successfully! 🗑️`, 'success');
              await loadProjects();
            } catch (err) {
              showToast(err.message, 'error');
            }
          });
        });

      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p style="color:var(--color-danger);">Failed to load projects.</p>';
      }
    }

    searchInput.addEventListener('input', debounce(loadProjects, 300));
    categorySelect.addEventListener('change', loadProjects);
    loadProjects();
  </script>
</body>
</html>
